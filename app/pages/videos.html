<!DOCTYPE html>
<html lang="en" class="h-full bg-gray-900">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Video Search</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="h-full text-white">

  <nav class="px-6 py-4 border-b border-gray-800">
    <h1 class="text-lg font-semibold tracking-tight">Video Search</h1>
  </nav>

  <main class="max-w-6xl mx-auto px-6 py-10">

    <!-- Search bar -->
    <form id="search-form" class="flex gap-3 mb-10">
      <input
        id="search-input"
        type="search"
        placeholder="Search videos…"
        class="flex-1 rounded-lg bg-gray-800 border border-gray-700 px-4 py-2.5 text-sm text-white placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
        autocomplete="off"
      />
      <button
        id="search-btn"
        type="submit"
        class="rounded-lg bg-blue-600 hover:bg-blue-500 disabled:opacity-50 px-5 py-2.5 text-sm font-medium transition-colors"
      >
        Search
      </button>
    </form>

    <!-- Empty state -->
    <p id="empty-state" class="hidden text-center text-gray-500 text-sm mt-16">
      No results found.
    </p>

    <!-- Results grid -->
    <div
      id="results-grid"
      class="grid gap-4 grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4"
    ></div>

  </main>

  <script src="../static/js/videos.js"></script>
</body>
</html>
