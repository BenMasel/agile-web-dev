# Defines the sidebar section structure and page order for /docs.
# Pages are referenced by slug (filename without .md).
# The order here controls both the sidebar display and the prev/next buttons.
# Pages not listed here will not appear in the sidebar.

sections:
  - title: Introduction
    pages:
      - overview

  - title: Contributing
    pages:
      - contributing
      - data-schema

  - title: Development
    pages:
      - architecture
      - checkpoints
      - roadmap
