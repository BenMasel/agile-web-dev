    accent_bg: "rgba(239, 159, 39, 0.1)"
    icon_svg: '<path d="M2 6h14M4 6V4a1 1 0 0 1 1-1h8a1 1 0 0 1 1 1v2M3 6l1 9h10l1-9" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>'
    benefits:
      - name: Boost Juice — Claremont
        description: Show your student card for 10% off all smoothies and juices at the Claremont Quarter Boost Juice, a short walk or bus ride from campus.
        value: "10% off"
        tags: [food, claremont]
      - name: Subway — Broadway
        description: Student discount on footlongs at the Broadway Fair Subway outlet with a valid student ID. Applies all day, every day.
        value: "$1 off footlong"
        tags: [food, subiaco]
      - name: JB Hi-Fi Education Store
        description: Access the JB Hi-Fi Education pricing portal with your student email for significant discounts on laptops, software, and accessories.
