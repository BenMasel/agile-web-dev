      - name: Cotton On Student Discount
        description: 20% off full-price items at Cotton On stores with a valid student card. Works in-store at Claremont or Broadway Fair outlets.
        value: "20% off"
        tags: [clothing, claremont]
      - name: Officeworks
        description: Officeworks matches competitor prices and offers student pricing on select items — worth checking before buying stationery or tech accessories.
        value: "Price match"
        tags: [shopping, stationery]
      - name: Readings & Reviews (UWA Bookshop)
        description: The campus bookshop offers discounts on required textbooks for enrolled UWA students. Check availability at the start of semester.
        value: "Varies"
        tags: [books, on-campus]
      - name: Chemist Warehouse — Nedlands
        description: Chemist Warehouse on Stirling Highway offers generic student pricing. Always worth checking if you need health or personal care products.
        value: "Low prices"
        tags: [health, nedlands]
