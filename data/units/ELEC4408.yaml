learning_outcomes:
  - Design passive and active microwave circuits using transmission line theory
  - Analyse S-parameters and use Smith chart tools for impedance matching
  - Characterise and design RF amplifiers, oscillators and mixers
  - Measure high-frequency circuit performance using vector network analysers
