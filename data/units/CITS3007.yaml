learning_outcomes:
  - Identify and remediate common software security vulnerabilities in C and other languages
  - Apply defensive programming practices to prevent buffer overflows and injection attacks
  - Use security analysis tools to audit source code for weaknesses
  - Understand adversarial models and threat modelling in secure software design
