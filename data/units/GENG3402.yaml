learning_outcomes:
  - Apply classical linear control theory to regulate the dynamic behaviour of systems
  - Perform stability analysis using time and frequency domain methods
  - Design feedback compensators for single-variable control systems
  - Use MATLAB and LabVIEW to simulate and implement control systems
