learning_outcomes:
  - Identify and classify engineering materials by structure and properties
  - Analyse failure modes including yielding, fatigue, fracture and creep
  - Apply static equilibrium principles to trusses and beam structures
  - Evaluate sustainability in the context of material reuse and recycling

