code: ENSC1002
title: Material behaviour from atoms to bridges
level: 1
credit_points: 6
semester: 1
faculty: Engineering
school: Science & Engineering
delivery: On-campus
location: Crawley, Perth
coordinator: Prof. A. Lee
coordinator_dept: Materials Engineering
availability: 2026 S1
availability_detail: Feb - Jun
incompatibilities:
  - code: ENSC1004
    title: Engineering Materials

prerequisites:
  - Maths Methods ATAR
  - Physics ATAR
  - or bridging equivalents

assessments:
  - name: Final exam
    weight: 50
  - name: In-class quizzes
    weight: 15
  - name: Group project 1
    weight: 20
  - name: Group project 2
    weight: 15

learning_outcomes:
  - Identify and classify engineering materials by structure and properties
  - Analyse failure modes including yielding, fatigue, fracture and creep
  - Apply static equilibrium principles to trusses and beam structures
  - Evaluate sustainability in the context of material reuse and recycling

associated_clubs:
  - ess
  - physsoc
  - matsoc

