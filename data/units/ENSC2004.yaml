code: ENSC2004
title: Engineering Mechanics
level: 2
credit_points: 6
semester: 1
faculty: Engineering
school: Science & Engineering
delivery: On-campus
location: Crawley, Perth
coordinator: Prof. Paul Stanwix
coordinator_dept: Materials Engineering
availability: 2026 S1
availability_detail: Feb - Jun
incompatibilities:
  - code: MATH1722
    title: Engineering Materials

prerequisites:
  all_of:
    - MATH1011
    - PHYS1001

assessments:
  - name: Final exam
    weight: 50
  - name: In-class quizzes
    weight: 15
  - name: Group project 1
    weight: 20
  - name: Group project 2
    weight: 15

learning_outcomes:
  - solve a range of problems that involve calculus and geometry of functions of more than one variable 
  - approximate functions of several variables by Taylor expansion
  - employ a range of integration techniques
  - integrate functions over objects in more than one dimension
  - work with vector fields and integrate them along paths and over surfaces

associated_clubs:
  - ess
  - physsoc
  - matsoc

