code: ELEC4402
title: Communications Systems
level: 4
credit_points: 6
semester: 2
faculty: Engineering
school: Electrical Engineering, Computing and Mathematical Sciences
delivery: On-campus
location: Crawley, Perth
coordinator: TBA
coordinator_dept: School of Electrical Engineering
