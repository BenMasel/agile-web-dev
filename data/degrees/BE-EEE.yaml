overview: >
  Develop expertise spanning the nanometre-scale of advanced electronic devices
  to the kilometre-scale of power transmission networks. Graduates are equipped
  to identify and solve engineering problems related to power generation,
  communications, embedded systems and signal processing, with consideration
  of economic, environmental and sustainability factors.

