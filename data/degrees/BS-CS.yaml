overview: >
  Develop competency in the theoretical, algorithmic and systems principles
  that underlie all aspects of computing. Graduates can identify suitable
  data structures and algorithms, design robust programs, apply core system
  knowledge, and communicate technical requirements clearly. The degree is
  accredited by the Australian Computer Society (ACS).

