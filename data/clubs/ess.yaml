description: >
  ESS is the peak student body for engineering students at UWA. We run social
  events, industry nights, academic support sessions, and advocacy programs to
  help students thrive throughout their degrees. Our study support arm covers
  first and second year core engineering units, connecting students with peer
  tutors and study groups.

